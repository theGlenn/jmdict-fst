name: Release Data Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-data:
    # release-plz tags each crate as `<crate>-v<version>`. The data tarball
    # is the runtime data for jmdict-fast specifically — bunpo does not need
    # it — so only build and attach for jmdict-fast releases.
    if: startsWith(github.event.release.tag_name, 'jmdict-fast-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate dictionary data
        run: cargo xtask generate

      - name: Resolve artifact name
        id: artifact
        run: |
          eval "$(cargo xtask version)"
          echo "name=jmdict-data-jmdict${jmdict_version}-fmt${format_version}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Bundle data files
        # fmt4 added gloss.fst + gloss_postings.bin; the loader rejects a
        # tarball missing either with DataNotFound, so they must ship too.
        run: |
          tar -czf "${{ steps.artifact.outputs.name }}" -C dist \
            kana.fst kanji.fst romaji.fst id.fst entries.bin \
            gloss.fst gloss_postings.bin

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.artifact.outputs.name }}" --clobber
