[package]
name = "jmdict-fast-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FFI-agnostic facade over jmdict-fast (designed for uniffi, flutter_rust_bridge, bolt-ffi, etc.)"
keywords = ["japanese", "dictionary", "jmdict", "ffi", "uniffi"]
categories = ["text-processing", "internationalization"]
publish = false

[features]
# Forwards to `jmdict-fast/install` so the facade exposes the same
# download/local-tarball/cache-dir surface to FFI consumers. No
# additional deps live in this crate — everything lives behind the
# `install` feature on the underlying engine.
install = ["jmdict-fast/install"]

[dependencies]
jmdict-fast = { path = "../jmdict-fast", version = "0.1.4" }
