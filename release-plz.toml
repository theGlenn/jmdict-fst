# Configuration for release-plz (https://release-plz.dev/).
# Defaults work for most cases; tweaks below are repo-specific.

[workspace]
# Group commit types in the generated CHANGELOG.md.
changelog_update = true
# Bump the inter-crate dependency requirement automatically when a
# workspace member is released (e.g. jmdict-fast pinning bunpo).
dependencies_update = true
# Tag and create a GitHub release for each published crate.
git_release_enable = true
# Each non-publishable crate needs BOTH `release = false` (skip tag +
# GitHub release) AND `publish = false` (acknowledge the Cargo.toml
# `publish = false`). Without the second flag release-plz fails the
# whole workflow with a "Cargo.toml says publish=false but config says
# publish=true" consistency error — see the failed run on commit
# 08fa4ba where v0.1.3 stalled.

# xtask: dev-only build helper, never published.
[[package]]
name = "xtask"
release = false
publish = false

# jmdict-fast-ffi: facade crate; not on crates.io until at least one
# per-generator wrapper ships a real consumer.
[[package]]
name = "jmdict-fast-ffi"
release = false
publish = false

# jmdict-fast-bolt: ships via `boltffi pack` to Swift/Kotlin/Java/C#/WASM,
# not crates.io.
[[package]]
name = "jmdict-fast-bolt"
release = false
publish = false

# jmdict-fast-flutter: ships via pub.dev (Dart package) + Flutter plugin,
# not crates.io.
[[package]]
name = "jmdict-fast-flutter"
release = false
publish = false
