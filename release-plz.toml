# Configuration for release-plz (https://release-plz.dev/).
# Defaults work for most cases; tweaks below are repo-specific.

[workspace]
# Group commit types in the generated CHANGELOG.md.
changelog_update = true
# Bump the inter-crate dependency requirement automatically when a
# workspace member is released (e.g. jmdict-fast pinning bunpo).
dependencies_update = true
# Tag and create a GitHub release for each published crate.
git_release_enable = true
# xtask is also marked `publish = false` in its Cargo.toml; this is a
# belt-and-suspenders override so release-plz never tries to bump or
# release it.
[[package]]
name = "xtask"
release = false

# jmdict-fast-ffi is also `publish = false` until the per-generator
# wrapper crates (uniffi/frb/bolt) land — releasing the facade on its
# own would publish an API that no foreign-language consumer can yet
# reach.
[[package]]
name = "jmdict-fast-ffi"
release = false

# jmdict-fast-bolt produces native + WASM artifacts via `boltffi pack`;
# crates.io publication is not the relevant distribution channel.
[[package]]
name = "jmdict-fast-bolt"
release = false

# jmdict-fast-flutter produces native libraries + Dart bindings via
# `flutter_rust_bridge_codegen`; distribution happens through pub.dev
# (Dart package) and the host Flutter plugin, not crates.io.
[[package]]
name = "jmdict-fast-flutter"
release = false
