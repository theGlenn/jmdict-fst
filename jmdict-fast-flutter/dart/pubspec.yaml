name: jmdict_fast
description: Blazing-fast Japanese dictionary engine — Flutter/Dart bindings over the jmdict-fast Rust library via flutter_rust_bridge.
version: 0.1.0
publish_to: 'none' # placeholder until the package is ready for pub.dev
repository: https://github.com/theGlenn/jmdict-fst
issue_tracker: https://github.com/theGlenn/jmdict-fst/issues

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned major; the generated bindings depend on a specific flutter_rust_bridge
  # runtime version, so any bump here must be matched in the Rust crate's
  # Cargo.toml.
  flutter_rust_bridge: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # The generated bindings ship as a Dart-only package (no Flutter assets);
  # the native library is produced by `cargo build` and linked by the host
  # Flutter app per the platform conventions (XCFramework on iOS,
  # .so/.dll on Android/desktop).
