# Standalone crate — intentionally NOT part of the parent workspace. The
# example mirrors how a downstream Flutter app would consume our published
# crate: it has its own `Cargo.lock` and resolves `jmdict_fast_flutter`
# like any other dependency (here via a path dep instead of crates.io).
[workspace]

[package]
name = "rust_lib_example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
# Demo this example crate consuming the published-style binding crate.
# In a real downstream Flutter app this would be:
#   jmdict_fast_flutter = "0.1"
# but inside the monorepo we use a path dep so the example tracks main.
# `default-features = false` turns off `frb-generated` on the binding
# crate. This example crate emits its OWN FRB dispatcher code, so the
# binding's dispatcher would duplicate every `frb_pde_ffi_dispatcher_*`
# symbol and the linker would reject the binary.
jmdict_fast_flutter = { path = "../../", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
