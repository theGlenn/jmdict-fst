[package]
name = "jmdict-fast-bolt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "BoltFFI bindings (Swift/Kotlin/Java/C#/WASM) for jmdict-fast — describes the FFI-agnostic facade"
keywords = ["japanese", "dictionary", "jmdict", "ffi", "boltffi"]
categories = ["text-processing", "internationalization"]
publish = false

[lib]
# `lib` keeps the crate usable from regular Rust workflows (cargo test,
# downstream Rust callers). `staticlib` + `cdylib` produce the C-ABI
# artifacts that `boltffi pack` consumes.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# `install` is enabled unconditionally here. The whole reason this crate
# exists is to ship a `boltffi pack` artifact to Swift/Kotlin/etc., and
# we want every foreign-language consumer to get the same surface
# (install + init_sdk_cache_dir). BoltFFI's `#[export]` proc-macro
# doesn't propagate `#[cfg]` to its generated FFI shims, so the
# alternative — two `#[export] impl Dict` blocks — would collide on
# `dict_free`. Forwarding install unconditionally is the cleanest call.
jmdict-fast-ffi = { path = "../jmdict-fast-ffi", version = "0.1.7", features = ["install"] }
boltffi = "0.25"
