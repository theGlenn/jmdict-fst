[package]
name = "jmdict-fast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Blazing-fast Japanese dictionary engine with FST-based indexing"
keywords = ["japanese", "dictionary", "jmdict", "lookup", "fst"]
categories = ["text-processing", "internationalization"]
documentation = "https://docs.rs/jmdict-fast"
homepage = "https://github.com/theGlenn/jmdict-fst"

[features]
embedded = []

[dependencies]
bunpo = "0.1.1"
deunicode = "1.6.2"
fst = { version = "0.4.7", features = ["levenshtein"] }
memmap2 = "0.9.4"
postcard = { version = "1.0", features = ["alloc"] }
serde = "1.0.219"
simd-json = "0.14.3"
unicode-normalization = "0.1.24"

[build-dependencies]

[dev-dependencies]
criterion = "0.5"
jmdict = "2.0.0"

[[bench]]
name = "lookup_word"
harness=false

[[bench]]
name = "minimal"
harness=false