[package]
name = "jmdict-fast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Blazing-fast Japanese dictionary engine with FST-based indexing"
keywords = ["japanese", "dictionary", "jmdict", "lookup", "fst"]
categories = ["text-processing", "internationalization"]
documentation = "https://docs.rs/jmdict-fast"
homepage = "https://github.com/theGlenn/jmdict-fst"

[features]
embedded = []
# Adds `Dict::install*` — download/extract/load from the GitHub release
# tarball (or a user-supplied URL / local tarball) into a cache dir. Off by
# default to keep the core crate free of HTTP / tar / dirs deps.
install = ["dep:ureq", "dep:tar", "dep:flate2", "dep:dirs"]

[dependencies]
bunpo = { path = "../bunpo", version = "0.1.5" }
deunicode = "1.6.2"
fst = { version = "0.4.7", features = ["levenshtein"] }
memmap2 = "0.9.4"
postcard = { version = "1.0", features = ["alloc"] }
serde = "1.0.219"
simd-json = "0.14.3"
unicode-normalization = "0.1.24"

# `install` feature deps — none of these are pulled in unless the feature
# is enabled.
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
dirs = { version = "5.0", optional = true }

[build-dependencies]

[dev-dependencies]
criterion = "0.5"
jmdict = "2.0.0"
jisho = "0.2.11"
memory-stats = "1.2"
tempfile = "3.10"

[[example]]
name = "startup_jmdict_fast_mmap"

[[example]]
name = "startup_jmdict_fast_embedded"
required-features = ["embedded"]

[[example]]
name = "startup_jisho"

[[example]]
name = "startup_jmdict"

[[bench]]
name = "lookup_word"
harness=false

[[bench]]
name = "minimal"
harness=false
